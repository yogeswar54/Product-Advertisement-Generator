services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://127.0.0.1:8501,http://localhost:8501}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
